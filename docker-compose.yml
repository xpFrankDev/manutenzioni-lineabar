x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - lineabar_mariadb:/var/lib/mysql
      - ./infraestructura/mariadb/inicializar-usuarios.sh:/docker-entrypoint-initdb.d/10-inicializar-usuarios.sh:ro
    ports:
      # Solo en loopback: útil para DBeaver con túnel SSH, nunca expuesto a Internet.
      - "127.0.0.1:${LINEABAR_DB_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  inicializacion:
    build:
      context: ./backend
      target: production
    restart: "on-failure:3"
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      # Migraciones y semilla necesitan permisos DDL: usan el usuario de migraciones.
      LINEABAR_DB_USER: ${LINEABAR_MIGRATIONS_USER}
      LINEABAR_DB_PASSWORD: ${LINEABAR_MIGRATIONS_PASSWORD}
      LINEABAR_CARGAR_DEMO: ${LINEABAR_CARGAR_DEMO:-0}
    command:
      - sh
      - -c
      - node src/base-datos/migraciones/ejecutar.js && node src/base-datos/semillas/sembrar.js
    depends_on:
      mariadb:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      PORT: 3001
      NODE_ENV: production
      # Nginx del host + Nginx del contenedor frontend: dos saltos de confianza.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vps-5586828-x.dattaweb.com}
      DB_HOST: mariadb
      DB_PORT: 3306
    expose:
      - "3001"
    depends_on:
      inicializacion:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/salute').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${LINEABAR_PORT:-8091}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/lineabar/ || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s

volumes:
  lineabar_mariadb:
