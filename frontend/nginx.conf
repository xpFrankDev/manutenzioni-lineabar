server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 12m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;

  # Cabeceras del borde interno. El Nginx del host añade las suyas y termina TLS.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:;" always;

  location = / { return 302 /lineabar/login; }
  location = /lineabar { return 301 /lineabar/; }
  location /lineabar/api/ {
    proxy_pass http://backend:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
  location ~* ^/lineabar/assets/ {
    alias /usr/share/nginx/html/lineabar/assets/;
    expires 1y;
  }
  location = /lineabar/index.html {
    alias /usr/share/nginx/html/lineabar/index.html;
    expires -1;
  }
  location /lineabar/ {
    alias /usr/share/nginx/html/lineabar/;
    try_files $uri $uri/ /lineabar/index.html;
  }
}
