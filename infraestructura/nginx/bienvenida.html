<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Servidor de aplicaciones</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1913; color: #ecf8f0; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: radial-gradient(circle at 80% 10%, #1a5a3d, transparent 34rem), #0b1913; }
      main { width: min(100%, 620px); border: 1px solid #39644d; border-radius: 20px; padding: clamp(28px, 7vw, 56px); background: rgb(16 42 30 / 88%); box-shadow: 0 24px 64px rgb(0 0 0 / 30%); }
      .marca { margin: 0 0 28px; color: #eec452; font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); letter-spacing: -.05em; }
      p { max-width: 48ch; margin: 18px 0 0; color: #c5d9cb; font-size: 17px; line-height: 1.6; }
      .estado { display: inline-flex; align-items: center; gap: 10px; margin-top: 32px; border: 1px solid #41795b; border-radius: 999px; padding: 9px 13px; background: #153e2a; color: #b9eccb; font-size: 14px; font-weight: 700; }
      .punto { width: 9px; height: 9px; border-radius: 50%; background: #62d28e; box-shadow: 0 0 0 5px rgb(98 210 142 / 14%); }
    </style>
  </head>
  <body>
    <main>
      <p class="marca">Servidor de aplicaciones</p>
      <h1>Bienvenido.</h1>
      <p>Este servidor aloja servicios independientes. Accede a la dirección específica proporcionada para tu aplicación.</p>
      <div class="estado"><span class="punto"></span>Servicios disponibles</div>
    </main>
  </body>
</html>
