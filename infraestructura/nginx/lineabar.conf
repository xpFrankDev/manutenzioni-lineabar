# Inserire nel virtual host del dominio. La barra finale è essenziale per il prefisso /lineabar/.
location = /lineabar { return 301 /lineabar/; }
location /lineabar/api/ { proxy_pass http://127.0.0.1:3001/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location /lineabar/ { alias /var/www/lineabar/frontend/dist/; try_files $uri $uri/ /lineabar/index.html; }
